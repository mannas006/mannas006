<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0c1427" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: url(#nameGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.2px;
      fill: #e0f2fe;
    }
    .tag {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="50" r="80" fill="#0284c7" opacity="0.18" filter="url(#glow)" />
  <circle cx="800" cy="170" r="100" fill="#7c3aed" opacity="0.16" filter="url(#glow)" />
  <circle cx="450" cy="110" r="60" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Subtle Grid Overlay -->
  <rect width="900" height="220" rx="16" fill="url(#grid)" />

  <!-- Accent Top Line -->
  <rect x="40" y="0" width="820" height="2" fill="url(#accentGrad)" rx="1" />

  <!-- Upper Pill Badge -->
  <g transform="translate(50, 32)">
    <rect width="265" height="24" rx="12" fill="url(#pillGrad)" opacity="0.25" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="12" r="4" fill="#38bdf8" />
    <text x="26" y="16" class="badge-text">CLOUD &amp; DEVOPS ENGINEER • SRE</text>
  </g>

  <!-- Name / Title -->
  <text x="50" y="105" class="title">Manas Dey</text>

  <!-- Subtitle -->
  <text x="52" y="138" class="subtitle">Co-Founder @ WebNexaLabs <tspan fill="#475569">|</tspan> Infrastructure as Code <tspan fill="#475569">|</tspan> Reliable Cloud Systems</text>

  <!-- Tech Highlights Pill Tags -->
  <g transform="translate(52, 162)">
    <!-- Tag 1: AWS -->
    <g transform="translate(0, 0)">
      <rect width="70" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="35" y="17" text-anchor="middle" class="tag">#AWS</text>
    </g>
    <!-- Tag 2: Azure -->
    <g transform="translate(80, 0)">
      <rect width="78" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="39" y="17" text-anchor="middle" class="tag">#Azure</text>
    </g>
    <!-- Tag 3: Docker -->
    <g transform="translate(168, 0)">
      <rect width="86" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="43" y="17" text-anchor="middle" class="tag">#Docker</text>
    </g>
    <!-- Tag 4: Kubernetes -->
    <g transform="translate(264, 0)">
      <rect width="115" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="57" y="17" text-anchor="middle" class="tag">#Kubernetes</text>
    </g>
    <!-- Tag 5: Terraform -->
    <g transform="translate(389, 0)">
      <rect width="105" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="52" y="17" text-anchor="middle" class="tag">#Terraform</text>
    </g>
    <!-- Tag 6: CI/CD -->
    <g transform="translate(504, 0)">
      <rect width="75" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="37" y="17" text-anchor="middle" class="tag">#CI/CD</text>
    </g>
    <!-- Tag 7: SRE -->
    <g transform="translate(589, 0)">
      <rect width="65" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="32" y="17" text-anchor="middle" class="tag">#SRE</text>
    </g>
  </g>

  <!-- Decorative terminal / cloud motif on right side -->
  <g transform="translate(730, 40)" opacity="0.6">
    <rect width="120" height="135" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1.2" />
    <circle cx="15" cy="15" r="3.5" fill="#ef4444" />
    <circle cx="27" cy="15" r="3.5" fill="#f59e0b" />
    <circle cx="39" cy="15" r="3.5" fill="#10b981" />
    <line x1="10" y1="28" x2="110" y2="28" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="48" font-family="monospace" font-size="10" fill="#38bdf8">&gt; terraform</text>
    <text x="14" y="65" font-family="monospace" font-size="10" fill="#a855f7">&gt; apply -auto</text>
    <text x="14" y="82" font-family="monospace" font-size="10" fill="#10b981">&gt; 100% synced</text>
    <text x="14" y="102" font-family="monospace" font-size="10" fill="#94a3b8">&gt; uptime 99.99</text>
    <text x="14" y="120" font-family="monospace" font-size="10" fill="#38bdf8">&gt; status: OK_</text>
  </g>
</svg>
